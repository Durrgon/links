<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <!-- Santa hat for December (js/seasons.js puts it on the avatar, slightly desaturated) -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0303a"/>
      <stop offset="0.55" stop-color="#b3141f"/>
      <stop offset="1" stop-color="#7a0a14"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eeeae2"/>
      <stop offset="1" stop-color="#cfc9bd"/>
    </radialGradient>
  </defs>
  <!-- the cone, flopping over to the right -->
  <path d="M13 60 C 19 36, 31 15, 52 10 C 69 6, 84 17, 89 39 L 82 42
           C 78 31, 71 25, 63 27 C 67 38, 71 49, 75 60 Z" fill="url(#red)"/>
  <!-- a soft fold -->
  <path d="M30 56 C 36 40, 46 26, 60 22" fill="none" stroke="#6e0912" stroke-opacity=".35"
        stroke-width="2.5" stroke-linecap="round"/>
  <!-- fur brim -->
  <rect x="5" y="53" width="76" height="17" rx="8.5" fill="url(#fur)"/>
  <path d="M10 66 C 30 70, 56 70, 77 65" fill="none" stroke="#b9b2a4" stroke-opacity=".6"
        stroke-width="1.5" stroke-linecap="round"/>
  <!-- pompom -->
  <circle cx="87" cy="45" r="9" fill="url(#fur)"/>
</svg>
