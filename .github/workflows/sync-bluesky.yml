name: Sync Bluesky images

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write # commit the new images
  pages: write # ask Pages to rebuild

concurrency:
  group: sync-bluesky
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==11.3.0

      - run: python scripts/sync_bluesky.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- images; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Sync avatar and header from Bluesky"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow's own token may not start a Pages build.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
